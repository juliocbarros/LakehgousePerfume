# O job rotaperfume_pipeline (15 tarefas):
#
#   raw_conferencia        (entrega 1)
#     └── bronze_ingestao   (entrega 2)
#           └── silver_clientes, silver_pedidos,
#               silver_itens_produtos, silver_crm_financeiro (entrega 3,
#               rodam em paralelo, todas dependem só de bronze_ingestao)
#                 └── gold_dimensoes (entrega 4)
#                       └── gold_fato_vendas
#                             └── gold_marts
#                                   ├── testes (obrigatório, derruba o job se falhar)
#                                   └── metricas_de_negocio (entrega 6)
#                                         └── auditoria_de_metadado (obrigatória, derruba o job se falhar)
#                                               └── ml_features (noite 3, prompt 1)
#                                                     └── ml_modelo (noite 3, prompt 2)
#                                                           └── ml_fila (noite 3, prompt 3 — esta)
#
# raw_conferencia confere que os 10 CSVs chegaram ao Volume bronze.raw.
# bronze_ingestao só roda se a conferência passar: a ordem é o conteúdo.
# As 4 tarefas silver rodam em paralelo porque nenhuma depende da outra.
# gold_dimensoes → fato_vendas → marts é sequencial: cada uma lê o que a
# anterior escreveu. Depois de marts, duas cadeias em paralelo: testes (a
# última linha de defesa numérica) e metricas_de_negocio → auditoria_de_
# metadado (as views de negócio e a última linha de defesa de metadado).
# ml_features só roda depois de testes E auditoria_de_metadado — o modelo
# não deve treinar em cima de dado que ainda não passou na validação.
# ml_modelo treina em cima de ml_features e quebra se o modelo não se pagar
# (três asserts: não pode ser bom demais, tem que ser melhor que moeda, e
# tem que ordenar melhor que aleatório).
# ml_fila cruza o score com a carteira vigente e escreve os 200 contatos
# da semana e as quatro funções que o agente consulta.

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql
              source: WORKSPACE

        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql
              source: WORKSPACE

        - task_key: silver_itens_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql
              source: WORKSPACE

        - task_key: silver_crm_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
              source: WORKSPACE

        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_produtos
            - task_key: silver_crm_financeiro
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql
              source: WORKSPACE

        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql
              source: WORKSPACE

        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql
              source: WORKSPACE

        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql
              source: WORKSPACE

        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-metricas-negocio.sql
              source: WORKSPACE

        - task_key: auditoria_de_metadado
          depends_on:
            - task_key: metricas_de_negocio
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-auditoria-metadado.sql
              source: WORKSPACE

        - task_key: ml_features
          depends_on:
            - task_key: testes
            - task_key: auditoria_de_metadado
          notebook_task:
            notebook_path: ../src/ml/features.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ml_modelo
          depends_on:
            - task_key: ml_features
          notebook_task:
            notebook_path: ../src/ml/modelo.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ml_fila
          depends_on:
            - task_key: ml_modelo
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/11-fila-semanal.sql
              source: WORKSPACE

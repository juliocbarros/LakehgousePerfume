# Genie space comercial, como código, subindo junto com o bundle.
# Chave (genie_comercial) diferente da chave do dashboard
# (dashboard_comercial) — o bundle recusa duas chaves iguais mesmo em
# tipos diferentes.

resources:
  genie_spaces:
    genie_comercial:
      title: 'Rota do Perfume · Comercial'
      description: 'Pergunte em português sobre vendas, margem, clientes em risco e ruptura de estoque da gold do rotaperfume.'
      file_path: comercial.geniespace.json
      warehouse_id: ${var.warehouse_id}
